<svg id="latte" viewBox="0 0 170 100" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Latte the walking cat" width="100%" height="100%">
  <style>
    #latte .l-leg { transform-box: fill-box; transform-origin: top center; animation: l-walk-a .48s ease-in-out infinite; }
    #latte .l-leg.b { animation-name: l-walk-b; }
    #latte .l-tail { transform-box: fill-box; transform-origin: right center; animation: l-tail-sway 1.6s ease-in-out infinite; }
    #latte .l-eye { transform-box: fill-box; transform-origin: center; animation: l-blink 5s ease-in-out infinite; }
    #latte .l-head-group { transform-box: fill-box; transform-origin: center; }
    #latte .l-ear { transform-box: fill-box; transform-origin: bottom center; }
    #latte.paused .l-leg { animation-play-state: paused; }
    #latte.paused .l-head-group { animation: l-look 2.6s ease-in-out; }
    #latte.paused .l-ear { animation: l-ear-twitch 2.6s ease-in-out; }
    @keyframes l-walk-a { 0%, 100% { transform: rotate(18deg); } 50% { transform: rotate(-18deg); } }
    @keyframes l-walk-b { 0%, 100% { transform: rotate(-18deg); } 50% { transform: rotate(18deg); } }
    @keyframes l-tail-sway { 0%, 100% { transform: rotate(-8deg); } 50% { transform: rotate(10deg); } }
    @keyframes l-blink { 0%, 92%, 100% { transform: scaleY(1); } 96% { transform: scaleY(0.1); } }
    @keyframes l-look { 0%, 100% { transform: rotate(0deg); } 30% { transform: rotate(10deg); } 60% { transform: rotate(-10deg); } 85% { transform: rotate(0deg); } }
    @keyframes l-ear-twitch { 0%, 40%, 100% { transform: rotate(0deg); } 45% { transform: rotate(-12deg); } 50% { transform: rotate(6deg); } }
    @media (prefers-reduced-motion: reduce) {
      #latte .l-leg, #latte .l-tail, #latte .l-eye, #latte.paused .l-head-group, #latte.paused .l-ear { animation: none; }
    }
  </style>

  <!-- back legs -->
  <rect class="l-leg" x="38" y="55" width="9" height="30" rx="4" fill="#D98E4A"/>
  <rect class="l-leg b" x="54" y="55" width="9" height="30" rx="4" fill="#E4A05F"/>
  <!-- tail -->
  <path class="l-tail" d="M118 55 C 150 45, 155 15, 132 8" stroke="#D98E4A" stroke-width="11" fill="none" stroke-linecap="round"/>
  <!-- body -->
  <ellipse cx="90" cy="52" rx="52" ry="26" fill="#E9A85E"/>
  <path d="M55 34 Q80 28 108 34" stroke="#C97D3C" stroke-width="4" fill="none" stroke-linecap="round" opacity=".6"/>
  <path d="M50 48 Q80 42 115 48" stroke="#C97D3C" stroke-width="4" fill="none" stroke-linecap="round" opacity=".6"/>
  <!-- front legs -->
  <rect class="l-leg b" x="108" y="58" width="9" height="30" rx="4" fill="#D98E4A"/>
  <rect class="l-leg" x="124" y="58" width="9" height="30" rx="4" fill="#E4A05F"/>

  <g class="l-head-group">
    <circle cx="134" cy="38" r="26" fill="#E9A85E"/>
    <path class="l-ear" d="M114 22 L108 4 L128 16 Z" fill="#E9A85E"/>
    <path class="l-ear" d="M148 16 L160 0 L156 22 Z" fill="#E9A85E"/>
    <path d="M117 20 L114 10 L124 17 Z" fill="#FFC8D6"/>
    <path d="M150 18 L157 8 L152 20 Z" fill="#FFC8D6"/>
    <ellipse class="l-eye" cx="126" cy="36" rx="4.5" ry="5.5" fill="#5A463A"/>
    <ellipse class="l-eye" cx="143" cy="34" rx="4.5" ry="5.5" fill="#5A463A"/>
    <circle cx="127.5" cy="34" r="1.3" fill="#fff"/>
    <circle cx="144.5" cy="32" r="1.3" fill="#fff"/>
    <path d="M132 44 L138 44 L135 48 Z" fill="#FFC8D6"/>
    <path d="M128 50 Q135 54 141 50" stroke="#5A463A" stroke-width="1.4" fill="none" stroke-linecap="round"/>
    <path d="M120 44 L108 42 M120 47 L107 48" stroke="#fff" stroke-width="1" opacity=".7" stroke-linecap="round"/>
    <path d="M146 44 L158 42 M146 47 L159 48" stroke="#fff" stroke-width="1" opacity=".7" stroke-linecap="round"/>
  </g>
</svg>
