<svg id="left-scene" viewBox="0 0 320 900" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMax slice" width="100%" height="100%" aria-hidden="true" focusable="false">
  <style>
    #left-scene .vine { transform-box: fill-box; transform-origin: top center; animation: ls-sway 4.5s ease-in-out infinite; }
    #left-scene .vine.b { animation-duration: 5.2s; animation-delay: .4s; }
    #left-scene .steam path { transform-box: fill-box; transform-origin: bottom center; animation: ls-steam 3.2s ease-in-out infinite; opacity: 0; }
    #left-scene .steam path:nth-child(2) { animation-delay: .8s; }
    #left-scene .steam path:nth-child(3) { animation-delay: 1.6s; }
    @keyframes ls-sway { 0%, 100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg); } }
    @keyframes ls-steam {
      0% { opacity: 0; transform: translateY(0) scaleX(1); }
      20% { opacity: .55; }
      80% { opacity: .25; }
      100% { opacity: 0; transform: translateY(-34px) scaleX(1.4); }
    }
    @media (prefers-reduced-motion: reduce) {
      #left-scene .vine, #left-scene .steam path { animation: none; opacity: .4; }
    }
  </style>

  <!-- wall -->
  <rect x="0" y="0" width="320" height="900" fill="#F1E2CE"/>
  <rect x="0" y="0" width="320" height="900" fill="url(#ls-wallgrain)" opacity=".5"/>
  <defs>
    <pattern id="ls-wallgrain" width="60" height="60" patternUnits="userSpaceOnUse">
      <rect width="60" height="60" fill="none"/>
      <circle cx="10" cy="10" r="1" fill="#e8d3b6"/>
      <circle cx="40" cy="30" r="1" fill="#e8d3b6"/>
      <circle cx="25" cy="50" r="1" fill="#e8d3b6"/>
    </pattern>
  </defs>

  <!-- hanging plants from ceiling -->
  <g class="vine">
    <line x1="60" y1="0" x2="60" y2="70" stroke="#8B6F52" stroke-width="3"/>
    <path d="M40 70 h40 l-6 22 h-28 z" fill="#C97D3C"/>
    <path d="M60 70 C 30 90, 25 60, 45 55" stroke="#7BAE7F" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M60 74 C 90 100, 96 65, 74 58" stroke="#8FC18F" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M60 78 C 55 105, 65 118, 60 130" stroke="#6FA073" stroke-width="5" fill="none" stroke-linecap="round"/>
  </g>
  <g class="vine b">
    <line x1="230" y1="0" x2="230" y2="55" stroke="#8B6F52" stroke-width="3"/>
    <path d="M210 55 h40 l-6 20 h-28 z" fill="#D9955B"/>
    <path d="M230 55 C 205 78, 198 48, 218 42" stroke="#7BAE7F" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M230 58 C 258 85, 262 50, 242 44" stroke="#8FC18F" stroke-width="5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- wooden shelf where Bean sits -->
  <rect x="30" y="330" width="220" height="18" rx="4" fill="#B98249"/>
  <rect x="30" y="346" width="220" height="6" fill="#8B6236"/>
  <path d="M46 348 L36 380 M234 348 L244 380" stroke="#8B6236" stroke-width="6" stroke-linecap="round"/>

  <!-- little books stacked at the shelf edge -->
  <rect x="188" y="300" width="14" height="30" fill="#D98E4A"/>
  <rect x="202" y="294" width="14" height="36" fill="#7BAE7F"/>
  <rect x="216" y="304" width="14" height="26" fill="#E4A05F"/>

  <!-- lower table with coffee cup -->
  <rect x="70" y="700" width="140" height="14" rx="4" fill="#B98249"/>
  <rect x="82" y="714" width="14" height="90" fill="#8B6236"/>
  <rect x="184" y="714" width="14" height="90" fill="#8B6236"/>

  <g transform="translate(118,650)">
    <ellipse cx="22" cy="52" rx="30" ry="7" fill="#00000014"/>
    <path d="M4 20 h36 l-4 26 a14 14 0 0 1 -28 0 z" fill="#FFFFFF" stroke="#EAD2B4" stroke-width="2"/>
    <ellipse cx="22" cy="20" rx="18" ry="5" fill="#5A463A" opacity=".85"/>
    <path d="M40 24 q14 2 12 16 q-2 12 -14 10" fill="none" stroke="#EAD2B4" stroke-width="4"/>
    <g class="steam">
      <path d="M12 14 q-6 -10 0 -18 q6 -8 0 -16" stroke="#fff" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <path d="M22 14 q6 -10 0 -18 q-6 -8 0 -16" stroke="#fff" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <path d="M32 14 q-6 -10 0 -18 q6 -8 0 -16" stroke="#fff" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    </g>
  </g>

  <!-- floor -->
  <rect x="0" y="840" width="320" height="60" fill="#E6C9A3"/>
</svg>
