<svg id="right-scene" viewBox="0 0 320 900" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMax slice" width="100%" height="100%" aria-hidden="true" focusable="false">
  <style>
    #right-scene .curtain { transform-box: fill-box; transform-origin: top center; animation: rs-curtain 5s ease-in-out infinite; }
    #right-scene .curtain.right { animation-duration: 5.6s; animation-delay: .3s; }
    #right-scene .rs-bird { transform-box: view-box; animation: rs-bird-fly 16s linear infinite; opacity: 0; }
    @keyframes rs-curtain { 0%, 100% { transform: rotate(-1.4deg); } 50% { transform: rotate(1.4deg); } }
    @keyframes rs-bird-fly {
      0%, 60% { opacity: 0; transform: translate(-40px, 40px); }
      62% { opacity: .9; }
      75% { opacity: .9; transform: translate(340px, 0px); }
      77%, 100% { opacity: 0; transform: translate(360px, -6px); }
    }
    @media (prefers-reduced-motion: reduce) {
      #right-scene .curtain, #right-scene .rs-bird { animation: none; opacity: 0; }
    }
  </style>

  <rect x="0" y="0" width="320" height="900" fill="#F1E2CE"/>

  <!-- sky glimpse + bird through window -->
  <path class="rs-bird" d="M0 0 q6 -6 12 0 q6 -6 12 0" stroke="#5A463A" stroke-width="2.4" fill="none" stroke-linecap="round" transform="translate(80,140)"/>

  <!-- window frame -->
  <rect x="50" y="60" width="220" height="260" rx="10" fill="#EAD9BE" stroke="#B98249" stroke-width="6"/>
  <rect x="62" y="72" width="196" height="236" fill="#CFE7EE"/>
  <rect x="62" y="72" width="196" height="236" fill="#ffffff" opacity=".08"/>
  <line x1="160" y1="72" x2="160" y2="308" stroke="#B98249" stroke-width="5"/>
  <line x1="62" y1="190" x2="258" y2="190" stroke="#B98249" stroke-width="5"/>
  <!-- rooftops silhouette outside window -->
  <path d="M62 220 l30 -30 l30 30 v88 h-60 z" fill="#E4A05F" opacity=".55"/>
  <path d="M150 240 l26 -24 l26 24 v68 h-52 z" fill="#D98E4A" opacity=".55"/>

  <!-- curtains -->
  <path class="curtain left" d="M40 40 q10 140 -6 280 q22 -8 30 0 q-6 -150 4 -280 z" fill="#FFC8D6" opacity=".9"/>
  <path class="curtain right" d="M280 40 q-10 140 6 280 q-22 -8 -30 0 q6 -150 -4 -280 z" fill="#FFC8D6" opacity=".9"/>
  <rect x="34" y="34" width="252" height="10" rx="5" fill="#B98249"/>

  <!-- small bookshelf -->
  <rect x="40" y="470" width="120" height="130" fill="#B98249" stroke="#8B6236" stroke-width="4"/>
  <line x1="40" y1="535" x2="160" y2="535" stroke="#8B6236" stroke-width="4"/>
  <rect x="48" y="480" width="14" height="50" fill="#D98E4A"/>
  <rect x="64" y="476" width="14" height="54" fill="#7BAE7F"/>
  <rect x="80" y="482" width="14" height="48" fill="#EF9A9A"/>
  <rect x="96" y="478" width="14" height="52" fill="#FFC8D6"/>
  <rect x="112" y="484" width="30" height="46" fill="#E4A05F"/>
  <rect x="50" y="545" width="26" height="42" fill="#7BAE7F"/>
  <rect x="80" y="540" width="18" height="47" fill="#D98E4A"/>
  <rect x="100" y="550" width="50" height="37" fill="#EF9A9A"/>

  <!-- pastry display -->
  <rect x="190" y="560" width="100" height="12" rx="4" fill="#B98249"/>
  <ellipse cx="212" cy="552" rx="16" ry="10" fill="#EAD2B4"/>
  <path d="M198 552 a14 10 0 0 1 28 0 z" fill="#E4A05F"/>
  <ellipse cx="252" cy="554" rx="14" ry="9" fill="#F7E9D7"/>
  <circle cx="246" cy="548" r="4" fill="#D9455B"/>
  <circle cx="256" cy="546" r="4" fill="#D9455B"/>
  <ellipse cx="278" cy="553" rx="12" ry="8" fill="#D98E4A"/>

  <rect x="0" y="840" width="320" height="60" fill="#E6C9A3"/>
</svg>
